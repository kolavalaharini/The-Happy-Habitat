<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Payment — Eco Vibes</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Licorice&display=swap" rel="stylesheet">
  
  <style>
   body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f4f8;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: linear-gradient(90deg, #43a047, #2e7d32);
      color: white;
     
    }
    .navbar ul {
      list-style: none;
      display: flex;
      margin: 0;
      gap: 18px;
    }
    .navbar a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
   .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
     /* Logo image */
.logo-img {
  width: 36px;
  height: 36px;
  border-radius: 40%;
  object-fit: contain;
  background: rgb(30, 116, 55);
  padding: 1px;
  box-shadow: 0 0 4px rgba(0,0,0,0.1);
}
/* Logo text */
.logo-container h1 {
  font-size: 1.5rem;
  font-family: 'Licorice', cursive;
  font-weight: 700;
  margin: 0;
  color: white;
}

    .page{max-width:600px;margin:28px auto;padding:18px}
    .panel{background:white;padding:18px;border-radius:12px;box-shadow:0 8px 20px rgba(20,70,20,0.06);}
    .payment-methods{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
    .method{padding:12px 20px;border-radius:10px;border:1px solid #eef6ee;cursor:pointer;min-width:120px;text-align:center;transition:0.3s}
    .method.active{background:#2e7d32;color:white;border:none;transform:scale(1.05)}
    .form-row{display:flex;gap:12px;margin-bottom:10px}
    input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #e6efe6;font-family:inherit}
    textarea{resize:vertical;min-height:60px}
    .pay-button{background:#0b3f0b;color:white;padding:12px;border-radius:10px;border:0;width:100%;font-weight:800;cursor:pointer}
    .pay-button:hover{background:#388e3c;}
    .summary{background:#e8f5e9;padding:14px;border-radius:10px;margin-top:18px;}
    .summary .total{font-size:1.2em;font-weight:700;color:#1b5e20;}
    .address-section{background:#f1f8f1;padding:12px;border-radius:10px;margin-bottom:20px;}
    .address-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
    .address-header button{background:none;border:none;color:#2e7d32;cursor:pointer;font-weight:600;}
    .logo-img { width: 36px;height: 36px;border-radius: 40%;object-fit: contain;background: rgb(30, 116, 55);padding: 1px;box-shadow: 0 0 4px rgba(0,0,0,0.1);}
    .logo-container h1 { font-size: 1.2rem;font-family: 'Licorice', cursive;font-weight: 700;margin: 0;color: white;}

/* Address text area */
#userAddress {
  width: 96%;
  min-height: 70px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #cde3cd;
  background-color: #fff;
  font-size: 14px;
  color: #2b472b;
  font-family: inherit;
  transition: all 0.2s ease-in-out;
}



  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo-container">
      <img src="the happy.jpg" alt="Thehappyhabitat Logo" class="logo-img">
      <h1>The happy habitat</h1>
    </div>
    <ul style="display:flex;gap:18px;list-style:none;">
      <li><a href="home.html"><i class="fa-solid fa-house"></i> Home</a></li>
      <li><a href="cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a></li>
      <li><a href="customer.html"><i class="fa-solid fa-user"></i></a></li>


      <li id="admin-link" style="display:none;">
        <a href="admin.html"><i class="fa-solid fa-lock"></i> Admin</a>
      </li>
      
    </ul>
  </nav>

  <main class="page">
    <div class="panel">
      <h2>Choose Payment Method</h2>

      <!-- Address Section -->
      <div class="address-section">
        <div class="address-header">
          <label for="userAddress"><b>Delivery Address</b></label>
          <button id="editAddressBtn" type="button">Edit</button>
        </div>
        <textarea id="userAddress" placeholder="Enter your address here"></textarea>
      </div>

      <div class="payment-methods">
        <div class="method active" data-method="card">Credit/Debit Card</div>
        <div class="method" data-method="upi">UPI</div>
        <div class="method" data-method="wallet">Wallet</div>
        <div class="method" data-method="cod">Cash on Delivery</div>
      </div>

      <!-- Card Form -->
      <form id="cardForm">
        <div class="form-row">
          <input id="cardNumber" type="text" placeholder="Card Number" required>
          <input id="exp" type="text" placeholder="MM/YY" required>
        </div>
        <div class="form-row">
          <input id="cardName" type="text" placeholder="Name on Card" required>
          <input id="cvv" type="text" placeholder="CVV" required>
        </div>
      </form>

      <!-- UPI Form -->
      <form id="upiForm" style="display:none;">
        <div class="form-row">
          <input id="upiId" type="text" placeholder="Enter UPI ID (e.g. name@bank)" required>
        </div>
      </form>

      <!-- Wallet Form -->
      <form id="walletForm" style="display:none;">
        <div class="form-row">
          <select id="walletSelect" required>
            <option value="">-- Select Wallet --</option>
            <option value="phonepe">PhonePe</option>
            <option value="paytm">Paytm</option>
            <option value="googlepay">GooglePay</option>
          </select>
        </div>
      </form>

      <!-- COD Info -->
      <form id="codForm" style="display:none;">
        <p>Pay with cash when your order is delivered.</p>
      </form>

      <div class="summary">
        <div>Total to Pay: ₹<span id="payTotal">0</span></div>
      </div>
      <button class="pay-button" id="payNow">Pay Now</button>
    </div>
  </main>

  <script>
    // --- PAYMENT PAGE CART ACCESS FIX ---
const loggedInUser = sessionStorage.getItem('loggedInUser');
if (!loggedInUser) window.location.href = "register.html";

const user = JSON.parse(sessionStorage.getItem('loggedInUser'));
const checkoutCartKey = 'checkoutCart_' + user.email;
const checkoutCart = JSON.parse(localStorage.getItem(checkoutCartKey) || '[]');
  


if (checkoutCart.length === 0) {
  alert("Cart is empty! Please add products before proceeding to payment.");
  window.location.href = 'cart.html';
}

// --- END FIX ---
    const addressKey = 'address_' + user.email;

    // Load address if saved
    const savedAddress = localStorage.getItem(addressKey);
    const addressField = document.getElementById('userAddress');
    const editBtn = document.getElementById('editAddressBtn');

    if(savedAddress){
      addressField.value = savedAddress;
      addressField.disabled = true;
      editBtn.textContent = "Edit";
    } else {
      addressField.disabled = false;
      editBtn.textContent = "Save";
    }

    // Edit/Save address toggle
    editBtn.onclick = () => {
      if(addressField.disabled){
        addressField.disabled = false;
        editBtn.textContent = "Save";
      } else {
        const addr = addressField.value.trim();
        if(!addr){ alert("Please enter an address before saving."); return; }
        localStorage.setItem(addressKey, addr);
        addressField.disabled = true;
        editBtn.textContent = "Edit";
        alert("Address saved successfully!");
      }
    };

    // Payment method switching
    const methods = document.querySelectorAll('.method');
    const cardForm = document.getElementById('cardForm');
    const upiForm = document.getElementById('upiForm');
    const walletForm = document.getElementById('walletForm');
    const codForm = document.getElementById('codForm');

    methods.forEach(m=>{
      m.onclick = ()=>{
        methods.forEach(x=>x.classList.remove('active'));
        m.classList.add('active');
        const method = m.dataset.method;
        cardForm.style.display = method==='card' ? 'block' : 'none';
        upiForm.style.display = method==='upi' ? 'block' : 'none';
        walletForm.style.display = method==='wallet' ? 'block' : 'none';
        codForm.style.display = method==='cod' ? 'block' : 'none';
      }
    });

    // Show total
    function updateSummary(){
      let total = parseFloat(localStorage.getItem("checkoutAmount")) || 0;
      document.getElementById('payTotal').textContent = total.toFixed(2);
    }
    updateSummary();

  
    // ✅ Pay Now logic — clears correct cart keys
document.getElementById('payNow').onclick = () => {
  const active = document.querySelector('.method.active').dataset.method;
  const addr = addressField.value.trim();
  if (!addr) return alert("Please enter and save your delivery address.");

  // Validate payment fields
  if (active === 'card') {
    const cn = document.getElementById('cardNumber').value.trim();
    const cvv = document.getElementById('cvv').value.trim();
    if (cn.length < 12) return alert('Enter valid card number');
    if (cvv.length < 3) return alert('Enter valid CVV');
  } else if (active === 'upi') {
    const upi = document.getElementById('upiId').value.trim();
    if (!upi.includes('@')) return alert('Enter valid UPI ID');
  } else if (active === 'wallet') {
    const wallet = document.getElementById('walletSelect').value;
    if (!wallet) return alert('Please select a wallet');
  }

  // --- Load cart & calculate totals ---
  const user = JSON.parse(sessionStorage.getItem('loggedInUser'));
  const checkoutCartKey = 'checkoutCart_' + user.email;
  const mainCartKey = 'cart_' + user.email;

  const cart = JSON.parse(localStorage.getItem(checkoutCartKey) || '[]');
  if (cart.length === 0) return alert('Cart is empty!');

  const subtotal = cart.reduce((sum, item) => sum + (item.price * (item.qty || 1)), 0);
  const shipping = subtotal > 1000 ? 0 : 49;
  const discount = parseFloat(localStorage.getItem('appliedDiscount') || '0') || 0;
  const total = subtotal + shipping - discount;

  // --- Save order ---
  const order = {
    date: new Date().toLocaleString(),
    items: cart.map(item => item.name),
    subtotal,
    shipping,
    discount,
    total,
    paymentMethod: active,
    address: addr
  };

  const ordersKey = 'orders_' + user.email;
  const orders = JSON.parse(localStorage.getItem(ordersKey) || '[]');
  orders.push(order);
  localStorage.setItem(ordersKey, JSON.stringify(orders));

  // --- ✅ Clear cart data after successful order ---
  localStorage.removeItem(checkoutCartKey);
  localStorage.removeItem(mainCartKey);
  localStorage.removeItem('appliedDiscount');

  alert("✅ Payment successful! Your order has been placed.");

  window.location.href = "success.html";
};

  </script>
</body>
</html>
