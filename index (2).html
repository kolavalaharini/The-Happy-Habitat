<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register / Login</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
    body, html { width:100%; height:100%; overflow:hidden; }
    video#bgVideo { position:fixed; right:0; bottom:0; min-width:100%; min-height:100%; z-index:-1; }
    .form-container {
        position:absolute; top:50%; left:50%;
        transform:translate(-50%, -50%);
        width:380px; background: rgba(255,255,255,0.9);
        padding:25px; border-radius:15px; text-align:center;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    input, select {
        width:100%; padding:10px; margin:10px 0;
        border-radius:6px; border:1px solid #ccc;
    }
    button {
        width:100%; padding:10px; border:none; border-radius:5px;
        background:#237726; color:white; font-weight:bold; cursor:pointer;
    }
    button:hover { background:#1a3a1b; }
    p { margin:8px 0; }
    a { cursor:pointer; color:#117534; text-decoration:underline; }
    .visible { display:block; }
    .hidden { display:none; }
    .error { color:red; font-size:0.9em; }
</style>
</head>
<body>

<video id="bgVideo" autoplay muted loop>
  <source src="project.mp4" type="video/mp4">
</video>

<div id="registerDiv" class="form-container visible">
  <h2>Register</h2>
  <form id="registerForm">
    <input type="text" id="regName" placeholder="Full Name" required>
    <input type="email" id="regEmail" placeholder="Email" required>
    <input type="password" id="regPassword" placeholder="Password" required>
    <input type="tel" id="regPhone" placeholder="Phone Number" required>
    <button type="submit">Register</button>
  </form>
  <p id="regError" class="error"></p>
  <p>Already have an account? <a href="#" id="showLogin">Login</a></p>
</div>

<div id="loginDiv" class="form-container hidden">
  <h2>Login</h2>
  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <select id="loginRole" required>
      <option value="" disabled selected>Select Role</option>
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>
    <button type="submit">Login</button>
  </form>
  <p id="loginError" class="error"></p>
  <p>Don't have an account? <a href="#" id="showRegister">Register</a></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const registerDiv = document.getElementById('registerDiv');
  const loginDiv = document.getElementById('loginDiv');

  // Predefined admin credentials
  const ADMIN_EMAIL = 'admin@eco.com';
  const ADMIN_PASSWORD = 'admin123';

  // Toggle forms
  document.getElementById('showLogin').onclick = e => {
    e.preventDefault();
    registerDiv.classList.replace('visible', 'hidden');
    loginDiv.classList.replace('hidden', 'visible');
  };
  document.getElementById('showRegister').onclick = e => {
    e.preventDefault();
    loginDiv.classList.replace('visible', 'hidden');
    registerDiv.classList.replace('hidden', 'visible');
  };

  // Register normal users
  document.getElementById('registerForm').onsubmit = e => {
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim().toLowerCase();
    const password = document.getElementById('regPassword').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const role = 'user'; // force normal user

    let users = JSON.parse(localStorage.getItem('users')) || [];
    if(users.some(u => u.email === email)){
      document.getElementById('regError').textContent = 'Email already registered!';
      return;
    }

    users.push({ name, email, password, phone, role });
    localStorage.setItem('users', JSON.stringify(users));
    alert('Registration successful! Please login.');
    registerDiv.classList.replace('visible', 'hidden');
    loginDiv.classList.replace('hidden', 'visible');
  };

  // Login
  document.getElementById('loginForm').onsubmit = e => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value.trim();
    const role = document.getElementById('loginRole').value;

    if(role === 'admin'){
      if(email === ADMIN_EMAIL && password === ADMIN_PASSWORD){
        const adminUser = { email: ADMIN_EMAIL, role: 'admin', name: 'Admin' };
        sessionStorage.setItem('loggedInUser', JSON.stringify(adminUser));
        window.location.href = 'admin-prod.html';
      } else {
        document.getElementById('loginError').textContent = 'Invalid admin credentials!';
      }
      return;
    }

    if(role === 'user'){
      const users = JSON.parse(localStorage.getItem('users')) || [];
      const user = users.find(u => u.email === email && u.password === password && u.role === 'user');
      if(!user){
        document.getElementById('loginError').textContent = 'Invalid credentials!';
        return;
      }
      sessionStorage.setItem('loggedInUser', JSON.stringify(user));
      window.location.href = 'home.html';
    }
  };
});
</script>

</body>
</html>
