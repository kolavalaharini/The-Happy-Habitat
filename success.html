doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Success — Eco Vibes</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2"></script>
  <style>
    body, html{margin:0;padding:0;height:100%;font-family:Inter,Arial,sans-serif;color:#123a12;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;}
    .video-bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-1;}
    .container{position:relative;background:rgba(255,255,255,0.9);padding:24px 36px;border-radius:14px;text-align:center;max-width:700px;box-shadow:0 10px 30px rgba(0,0,0,0.1);}
    h1{margin-top:0;color:#1b5e20;}
    p{color:#456a45;font-size:1.05rem;margin:12px 0;}
    .btn{display:inline-block;margin-top:18px;padding:12px 20px;background:#2e7d32;color:white;border-radius:10px;text-decoration:none;font-weight:800;transition:0.3s;}
    .btn:hover{background:#388e3c;}
    .summary{margin-top:18px;text-align:left;}
    .summary h3{margin-bottom:6px;}
    .summary ul{padding-left:20px;}
    .confetti {position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1000;}
    .confetti-piece {position:absolute;width:8px;height:8px;background-color:#2e7d32;border-radius:50%;opacity:0;}
  </style>
</head>
<body>

  <!-- Background video -->
  <video class="video-bg" autoplay muted loop>
    <source src="project.mp4" type="video/mp4">
   
  </video>

  <div class="confetti" id="confetti"></div>

  <div class="container">
    <h1>Thank You for Choosing The happy habitat! 🌳</h1>
    <p>Your eco-friendly purchase is helping the planet and reducing plastic waste.</p>

  
    <a class="btn" href="index.html">Continue Shopping</a>
  </div>

<script>
  // Clear cart after success
  localStorage.removeItem('cart');
  localStorage.removeItem('lastPurchaseItems');
  localStorage.removeItem('lastPurchaseTotal');
</script>

</body>
</html>
