<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart — The Happy Habitat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Licorice&display=swap" rel="stylesheet">
 
  <style>
    :root {
      --green: #2e7d32;
      --muted: #f1f6f1;
      --card: #fff;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f4f8;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 22px;
      background: linear-gradient(90deg, #43a047, #2e7d32);
     
       color: white;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .navbar ul {
      list-style: none;
      display: flex;
      gap: 18px;
      margin: 0;
      padding: 0;
      align-items: center;
    }
    .navbar a {
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .badge {
      background: red;
      color: white;
      border-radius: 50%;
      padding: 2px 7px;
      font-size: 12px;
      margin-left: 6px;
    }
   .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    /* Logo image */
.logo-img {
  width: 36px;
  height: 36px;
  border-radius: 40%;
  object-fit: contain;
  background: rgb(30, 116, 55);
  padding: 1px;
  box-shadow: 0 0 4px rgba(0,0,0,0.1);
}
/* Logo text */
.logo-container h1 {
  font-size: 1.4rem;
  font-family: 'Licorice', cursive;
  font-weight: 700;
  margin: 0;
  color: white;
}
    .page { max-width: 1100px; margin: 28px auto; padding: 0 18px; }
    .grid { display: grid; grid-template-columns: 1fr 360px; gap: 22px; }
    @media (max-width: 940px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      padding: 18px;
      border-radius: var(--radius);
      box-shadow: 0 6px 18px rgba(20,70,20,0.06);
    }
    .cart-row {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #eef6ee;
      margin-bottom: 12px;
    }
    .cart-row img { width: 92px; height: 72px; object-fit: cover; border-radius: 8px; }
    .cart-info { flex: 1; }
    .cart-info h4 { margin: 0 0 6px; font-size: 1rem; color: var(--green); }
    .cart-info p { margin: 0; font-size: 0.9rem; color: #556; }
    .qty { display: flex; align-items: center; gap: 8px; }
    .qty button {
      background: var(--muted);
      border: 1px solid #e6efe6;
      padding: 6px 9px;
      border-radius: 8px;
      cursor: pointer;
    }
    .remove {
      background: #ffebe9;
      border: 0;
      color: #c62f2f;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }
    .summary h3 { margin: 0 0 10px; color: var(--green); }
    .summary .row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
    }
    .total { font-size: 1.25rem; font-weight: 800; color: #0b3f0b; }
    .coupon-box { display: flex; gap: 20px; margin-top: 12px; }
    .coupon-box select,
    .coupon-box input {
      flex: 0;
      padding: 0px;
      border-radius: 8px;
      border: 1px solid #e6efe6;
    }
    .coupon-box button {
      padding: 10px 6px;
      border-radius: 8px;
      background: var(--green);
      color: white;
      border: 0;
      cursor: pointer;
    }
    .pay-btn {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #1b5e20;
      color: white;
      border: 0;
      font-weight: 800;
      cursor: pointer;
    }
    .empty { text-align: center; padding: 40px; color: #376b3a; }
    .co2-div {
      margin-top: 20px;
      padding: 12px;
      background: #e8f5e9;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <!-- ✅ Navbar -->
  <nav class="navbar">
    <div class="logo-container">
      <img src="the happy.jpg" alt="Logo" style="width:36px;height:36px;border-radius:40%;">
      <h1 style="font-size:1.2rem;margin:0 0 0 8px;">The Happy Habitat</h1>
    </div>
    <ul>
      <li><a href="home.html"><i class="fa-solid fa-house"></i> Home</a></li>
      <li><a href="wishlist.html"><i class="fa-regular fa-heart"></i> <span id="wishlist-count" class="badge">0</span></a></li>
      <li><a href="cart.html"><i class="fa-solid fa-cart-shopping"></i> <span id="cart-count" class="badge">0</span></a></li>
      <li><a href="index.html"><i class="fa-solid fa-store"></i></a></li>
      <li><a href="customer.html"><i class="fa-solid fa-user"></i></a></li>
      <li><a href="#" onclick="logoutUser()"><i class="fa fa-sign-out"></i> Logout</a></li>
    </ul>
  </nav>

  <!-- ✅ Cart Content -->
  <main class="page">
    <div class="grid">
      <div>
        <div class="card">
          <h2>Your Cart</h2>
          <div id="itemsList"></div>
        </div>
      </div>
      <aside>
        <div class="card summary">
          <h3>Order Summary</h3>
          <div class="row"><span>Subtotal</span><span id="subTotal">₹0</span></div>
          <div class="row"><span>Shipping</span><span id="shipping">₹0</span></div>
          <div class="row"><span>Discount</span><span id="discount">-₹0</span></div>
          <div class="row total"><span>Total</span><span id="grandTotal">₹0</span></div>

          <div class="coupon-box">
            <select id="couponSelect">
              <option value="">-- Select a coupon --</option>
              <option value="SAVE100">SAVE100 - ₹100 off on orders > ₹2000</option>
              <option value="SAVE500">SAVE500 - ₹500 off on orders > ₹5000</option>
              <option value="BAMBOO50">BAMBOO50 - ₹50 off per bamboo product</option>
            </select>
            <button id="applyCoupon">Apply</button>
          </div>
          <button id="checkoutBtn" class="pay-btn">Proceed to Payment</button>
        </div>
      </aside>
    </div>
  </main>

  <script>
    // ===== USER & KEY SETUP =====
    const loggedInUser = JSON.parse(sessionStorage.getItem("loggedInUser"));
    if (!loggedInUser) window.location.href = "register.html";
    const cartKey = 'cart_' + loggedInUser.email;
    const wishlistKey = 'wishlist_' + loggedInUser.email;

    // ===== HELPERS =====
    const getCart = () => JSON.parse(localStorage.getItem(cartKey) || "[]");
    const saveCart = (cart) => { localStorage.setItem(cartKey, JSON.stringify(cart)); updateCounts(); renderCart(); };
    const getWishlist = () => JSON.parse(localStorage.getItem(wishlistKey) || "[]");
    const updateCounts = () => {
      const cart = getCart();
      const wishlist = getWishlist();
      document.getElementById("cart-count").textContent = cart.reduce((s, i) => s + (i.qty || 1), 0);
      document.getElementById("wishlist-count").textContent = wishlist.length;
    };

    // ===== RENDER CART =====
    function renderCart() {
      const list = document.getElementById("itemsList");
      const cart = getCart();
      list.innerHTML = "";

      if (cart.length === 0) {
        list.innerHTML = `<div class="empty"><p>Your cart is empty 🛒</p></div>`;
        document.getElementById("subTotal").textContent = "₹0";
        document.getElementById("discount").textContent = "-₹0";
        document.getElementById("grandTotal").textContent = "₹0";
        const existing = document.querySelector('.summary .co2-div');
        if (existing) existing.remove();
        return;
      }

      let sub = 0;
      let totalCO2 = 0;
      const co2Values = { bamboo:2, recycled:3, cotton:1.5, jute:1, wood:1, glass:0.6, metal:4, organicFabric:1.2, herbal:0.9 };

      const products = JSON.parse(localStorage.getItem('products')) || [];

cart.forEach(item => {
  const prod = products.find(p => p.id === item.id);
  if (!prod) return; // skip deleted admin items

  const price = prod.price;
  const qty = item.qty || 1;
  sub += price * qty;
  totalCO2 += (co2Values[prod.material] || 0.5) * qty;

  const row = document.createElement("div");
  row.className = "cart-row";
  row.innerHTML = `
    <img src="${prod.img}" alt="${prod.name}">
    <div class="cart-info">
      <h4>${prod.name}</h4>
      <p>₹${price} each</p>
      <div class="qty">
        <button class="dec" data-id="${item.id}">-</button>
        <div>${qty}</div>
        <button class="inc" data-id="${item.id}">+</button>
      </div>
    </div>
    <button class="remove" data-id="${item.id}">Remove</button>
    <div><strong>₹${(price * qty).toFixed(2)}</strong></div>
  `;
  list.appendChild(row);
});


      document.querySelectorAll(".inc").forEach(b => b.onclick = () => modifyQty(b.dataset.id, 1));
      document.querySelectorAll(".dec").forEach(b => b.onclick = () => modifyQty(b.dataset.id, -1));
      document.querySelectorAll(".remove").forEach(b => b.onclick = () => removeItem(b.dataset.id));

      const shipping = sub > 1000 ? 0 : 49;
      const discount = parseFloat(localStorage.getItem("appliedDiscount") || "0") || 0;
      const total = Math.max(0, sub + shipping - discount);

      document.getElementById("subTotal").textContent = `₹${sub.toFixed(2)}`;
      document.getElementById("shipping").textContent = `₹${shipping.toFixed(2)}`;
      document.getElementById("discount").textContent = `-₹${discount.toFixed(2)}`;
      document.getElementById("grandTotal").textContent = `₹${total.toFixed(2)}`;

      const treesPlanted = (totalCO2 / 20).toFixed(2);
      const existing = document.querySelector(".summary .co2-div");
      if (existing) existing.remove();
      const co2Div = document.createElement("div");
      co2Div.className = "co2-div";
      co2Div.innerHTML = `
        <h4>🌿 Environmental Impact</h4>
        <p>You helped prevent <strong>${totalCO2.toFixed(2)} kg</strong> of CO₂!</p>
        <p>That's like planting <strong>${treesPlanted}</strong> trees 🌳</p>
      `;
      document.querySelector(".summary").appendChild(co2Div);
    }

    function modifyQty(id, delta) {
      let cart = getCart();
      cart = cart.map(i => i.id == id ? { ...i, qty: Math.max(1, (i.qty || 1) + delta) } : i);
      saveCart(cart);
    }

    function removeItem(id) {
      let cart = getCart().filter(i => i.id != id);
      saveCart(cart);
    }

    // ===== COUPON LOGIC =====
    document.getElementById("applyCoupon").addEventListener("click", () => {
      const code = document.getElementById("couponSelect").value;
      const cart = getCart();
      if (!code) return alert("Please select a coupon.");
      let sub = cart.reduce((s, i) => s + i.price * (i.qty || 1), 0);
      let discount = 0;

      if (code === "SAVE100" && sub > 2000) discount = 100;
      else if (code === "SAVE500" && sub > 5000) discount = 500;
      else if (code === "BAMBOO50") {
        cart.forEach(i => { if (i.material === "bamboo") discount += 50 * (i.qty || 1); });
        if (discount === 0) return alert("No bamboo products in cart for this coupon");
      } else return alert("Coupon not applicable.");

      localStorage.setItem("appliedDiscount", discount);
      alert(`Coupon applied: -₹${discount}`);
      renderCart();
    });

    // ===== CHECKOUT =====
    document.getElementById("checkoutBtn").addEventListener("click", () => {
      const cart = getCart();
      if (cart.length === 0) return alert("Your cart is empty!");
      const total = cart.reduce((s, i) => s + i.price * (i.qty || 1), 0);
      localStorage.setItem("checkoutCart_" + loggedInUser.email, JSON.stringify(cart));
      localStorage.setItem("checkoutAmount", total);
      window.location.href = "payment.html";
    });

    function logoutUser() {
      sessionStorage.removeItem("loggedInUser");
      window.location.href = "register.html";
    }

    document.addEventListener("DOMContentLoaded", () => { updateCounts(); renderCart(); });
  </script>
</body>
</html>
