  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f0f4f8; }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 30px;
      background: linear-gradient(90deg, #245326, #2e7d32);
      color: white;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .navbar ul { list-style: none; display: flex; gap: 30px; }
    .navbar li { display: inline; }
    .navbar a { color: white; text-decoration: none; font-weight: 900; transition: color 0.3s; }
    .navbar a:hover { color: #c8e6c9; }

    /* Category Bar */
    .category-bar {
      display: flex;
      overflow-x: auto;
      justify-content: center;
      gap: 25px;
      padding: 10px 50px;      
      background: #fff;
    }
    .category-item {
      margin-right: 15px;
      padding: 8px 15px;
      cursor: pointer;
      border-radius: 8px;
      font-weight: bold;
      color: #257329;
      background: #f0fff5;
      transition: all 0.3s ease;
    }
    .category-item:hover {
      transform: translateY(-5px) scale(1.08);
      box-shadow: 0 6px 15px rgba(0, 128, 0, 0.3);
      background: linear-gradient(180deg, #ffffff, #c8f5d4);
    }
    .category-item.active {
      background: #3f7742;
      color: white;
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(64, 94, 64, 0.4);
    }

    .main-content { padding:10px; }

    /* Product Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
      padding: 0 20px;
    }
    .product-card {
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: all 0.3s ease;
      transform: translateY(0);
      position: relative;
      overflow: hidden;
    }
    .product-card:hover {
      transform: translateY(-8px) scale(1.04);
      box-shadow: 0 8px 20px rgba(0, 128, 0, 0.25);
      background: linear-gradient(180deg, #ffffff, #f3fff5);
    }
    .product-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      transition: transform 0.4s ease;
    }
    .product-card:hover img { transform: scale(1.05); }
    .product-card h3 { font-size: 1em; color: #2e7d32; margin: 8px 0 5px; }
    .price { font-size: 0.9em; font-weight: bold; color: #1b5e20; margin-bottom: 6px; }
    .desc { font-size: 0.8em; color: #555; margin-bottom: 8px; }
    button.add-cart { font-size: 0.85em; padding: 5px 8px; cursor: pointer; background:#27852a; color:white; border:none; border-radius:6px; }
    button.add-cart:hover { background:#45a049; }
    .qty-control { display:flex; justify-content:center; align-items:center; gap:10px; margin-top:10px; }
    .cart-count, .wishlist-count { background:red; border-radius:50%; padding:2px 6px; font-size:12px; vertical-align:super; margin-left:3px; }

    /* Heart Wishlist */
    .heart {
      position: absolute;
      top: 8px ;
      right: 8px;
      font-size: 20px;
      cursor: pointer;
      color: #ccc;
      z-index: 20;
      transition: all 0.3s ease;
      pointer-events: auto;
    }
    .heart.active { color:red; }
    .heart.pop { transform: scale(1.4); transition: transform 0.3s ease; }
    /* Logo container */
    .logo-container {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Logo image */
.logo-img {
  width: 36px;
  height: 36px;
  border-radius: 40%;
  object-fit: contain;
  background: rgb(30, 116, 55);
  padding: 1px;
  box-shadow: 0 0 4px rgba(0,0,0,0.1);
}

/* Logo text */
.logo-container h1 {
  font-size: 1.2rem;
  font-family: 'Licorice', cursive;
  font-weight: 700;
  margin: 0;
  color: white;
}

    /* Hero Section */
    .hero-section {
      position: relative;
      width: 100%;
      height: 300px;
      overflow: hidden;
      border-radius: 12px;
      margin: 20px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e0f7fa;
    }
    .hero-section img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.7);
    }
    .hero-text {
      position: absolute;
      color: white;
      text-align: center;
    }
    .hero-text h1 { font-size: 2em; margin-bottom: 10px; }
    .hero-text p { font-size: 1em; }
  </style>

  <script>
    // Navigate to wishlist page
    function goToWishlist() {
      window.location.href = "wishlist.html";
    }
  
    // Logout function
    function logoutUser() {
      sessionStorage.removeItem('loggedInUser');
      localStorage.removeItem('cart');
      localStorage.removeItem('wishlist');
      window.location.href = "register.html";
    }
  
    // Update cart & wishlist counts dynamically
    function updateCounts() {
      const cartCountElem = document.getElementById("cart-count");
      const wishlistCountElem = document.getElementById("wishlist-count");
  
      const cart = JSON.parse(localStorage.getItem("cart") || "[]");
      const wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
  
      if(cartCountElem) {
        const totalQty = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
        cartCountElem.textContent = totalQty;
      }
      if(wishlistCountElem) {
        wishlistCountElem.textContent = wishlist.length;
      }
    }
  
    document.addEventListener("DOMContentLoaded", updateCounts);
    setInterval(updateCounts, 1000); // keeps counts in sync across tabs/pages
  </script>

      const productGrid = document.getElementById("productGrid");
      const categoryList = document.getElementById("categoryList");
      const cartCount = document.getElementById("cart-count");
      const wishlistCount = document.getElementById("wishlist-count");
      let currentCategory = "home";

      function getCart() { return JSON.parse(localStorage.getItem("cart")) || []; }
      function saveCart(cart) { localStorage.setItem("cart", JSON.stringify(cart)); updateCartCount(); }
      function getWishlist(){ return JSON.parse(localStorage.getItem("wishlist")) || []; }
      function saveWishlist(wishlist){ localStorage.setItem("wishlist",JSON.stringify(wishlist)); updateWishlistUI(); }

      function addToCart(productId) {
        let cart = getCart();
        let item = cart.find(p => p.id === productId);
        if(item) item.qty++;
        else cart.push({...products.find(p => p.id===productId), qty:1});
        saveCart(cart);
      }

      function changeQty(productId, delta){
        let cart = getCart();
        let item = cart.find(p=>p.id===productId);
        if(!item) return;
        item.qty += delta;
        if(item.qty <= 0) cart = cart.filter(p=>p.id!==productId);
        saveCart(cart);
        renderProducts(currentCategory);
      }

      function updateCartCount(){
        let cart = getCart();
        let totalQty = cart.reduce((sum,item)=>sum+item.qty,0);
        if(cartCount) cartCount.textContent = totalQty;
      }

      function toggleWishlist(productId){
        let wishlist = getWishlist();
        const index = wishlist.indexOf(productId);
        if(index > -1) wishlist.splice(index,1);
        else wishlist.push(productId);
        saveWishlist(wishlist);
      }

      function updateWishlistUI(){
        const wishlist = getWishlist();
        document.querySelectorAll(".heart").forEach(h=>{
          const id = parseInt(h.dataset.id);
          if(wishlist.includes(id)) h.classList.add("active");
          else h.classList.remove("active");
        });
        if(wishlistCount) wishlistCount.textContent = wishlist.length;
      }

      function renderHero(category){
        const heroDiv = document.getElementById("categoryHero");
        const hero = heroes[category];
        heroDiv.innerHTML = `
          <div class="hero-section">
            <img src="${hero.img}" alt="${category} Hero">
            <div class="hero-text">
              <h1>${hero.title}</h1>
              <p>${hero.desc}</p>
            </div>
          </div>
        `;
      }

      function renderProducts(category){
        currentCategory = category;
        productGrid.innerHTML = "";
        const filtered = products.filter(p=>p.cat===category);
        const cart = getCart();
        const wishlist = getWishlist();

        filtered.forEach(prod=>{
          const itemInCart = cart.find(c=>c.id===prod.id);
          const qty = itemInCart ? itemInCart.qty : 0;
          const card = document.createElement("div");
          card.className = "product-card";
          let heartClass = wishlist.includes(prod.id) ? "heart active" : "heart";
          let innerHTML = `
            <div class="${heartClass}" data-id="${prod.id}">❤</div>
            <img src="${prod.img}" alt="${prod.name}" class="product-img">
            <h3>${prod.name}</h3>
            <p class="price">₹${prod.price}</p>
            <p class="desc">${prod.desc}</p>
          `;
          if(qty===0){
            innerHTML += `<button class="add-cart" data-id="${prod.id}">Add to Cart</button>`;
          } else {
            innerHTML += `
              <div class="qty-control">
                <button class="minus" data-id="${prod.id}">-</button>
                <span class="qty">${qty}</span>
                <button class="plus" data-id="${prod.id}">+</button>
              </div>
            `;
          }
          card.innerHTML = innerHTML;
          productGrid.appendChild(card);
        });

        document.querySelectorAll(".add-cart").forEach(btn=>{
          btn.addEventListener("click", e=>{
            addToCart(parseInt(e.target.dataset.id));
            renderProducts(currentCategory);
          });
        });
        document.querySelectorAll(".plus").forEach(btn=>{ btn.addEventListener("click", e=>{ changeQty(parseInt(e.target.dataset.id),1); }); });
        document.querySelectorAll(".minus").forEach(btn=>{ btn.addEventListener("click", e=>{ changeQty(parseInt(e.target.dataset.id),-1); }); });
        document.querySelectorAll(".heart").forEach(h=>{
          h.addEventListener("click", e=>{
            const heart = e.target;
            const id = parseInt(heart.dataset.id);
            toggleWishlist(id);
            heart.classList.add("pop");
            setTimeout(()=>heart.classList.remove("pop"),300);
          });
        });
        updateWishlistUI();
      }

      categoryList.addEventListener("click", e=>{
        const item = e.target.closest(".category-item");
        if(!item) return;
        const category = item.dataset.cat;
        renderHero(category);
        renderProducts(category);
        categoryList.querySelectorAll(".category-item").forEach(el=>el.classList.remove("active"));
        item.classList.add("active");
      });

      // Initial render
      renderHero("home");
      renderProducts("home");
      updateCartCount();
      updateWishlistUI();
    });
  </script>
